, "例：玄関のチャイムが壊れている", "напр. Сломан дверной звонок"], "z. B. Stimmt diese Zahl wirklich?": ["e.g. Is this number really right?", "p. ex. Ce chiffre est-il vraiment exact ?", "例如：这个数字真的对吗？", "例：この数字は本当に正しい？", "напр. Эта цифра действительно верна?"], "z. B. Welche Bahn nehmt ihr?": ["e.g. Which train do you take?", "p. ex. Quel train prenez-vous ?", "例如：你们坐哪路车？", "例：どの電車に乗りますか？", "напр. Каким трамваем вы ездите?"], "Bitte gib einen Titel mit mindestens 3 Zeichen ein.": ["Please enter a title with at least 3 characters.", "Saisis un titre d’au moins 3 caractères.", "请输入至少 3 个字符的标题。", "3文字以上のタイトルを入力してください。", "Введи заголовок не короче 3 символов."], "Adresse der Seite (optional)": ["Page address (optional)", "Adresse de la page (facultatif)", "页面地址（可选）", "ページのアドレス（任意）", "Адрес страницы (необязательно)"], "Textstelle (optional)": ["Passage (optional)", "Passage (facultatif)", "文字段落（可选）", "文章の一部（任意）", "Фрагмент текста (необязательно)"], "Kopiere hier den Satz hinein, um den es geht": ["Paste the sentence you mean here", "Colle ici la phrase concernée", "把相关的句子粘贴到这里", "対象の文をここに貼り付けてください", "Вставь сюда нужное предложение"], "Seite als Datei hinzufügen (optional)": ["Add page as a file (optional)", "Ajouter la page en fichier (facultatif)", "以文件形式添加页面（可选）", "ページをファイルで追加（任意）", "Добавить страницу файлом (необязательно)"], "So bleibt der heutige Stand erhalten, auch wenn die Seite später geändert wird. Im Browser: Seite speichern unter … als „Webseite, nur HTML“.": ["This keeps today’s version, even if the page changes later. In your browser: Save page as … “Webpage, HTML only”.", "Ainsi la version d’aujourd’hui est conservée, même si la page change plus tard. Dans le navigateur : Enregistrer la page sous … « Page web, HTML uniquement ».", "这样即使页面之后被修改，也会保留今天的版本。在浏览器中：另存为……选择“网页，仅 HTML”。", "こうすると、ページが後で変更されても今日の状態が残ります。ブラウザで「名前を付けて保存」→「ウェブページ（HTMLのみ）」を選びます。", "Так сохранится сегодняшняя версия, даже если страницу потом изменят. В браузере: «Сохранить страницу как …» → «Веб-страница, только HTML»."], "Datei auswählen": ["Choose file", "Choisir un fichier", "选择文件", "ファイルを選ぶ", "Выбрать файл"], "Wo ist das?": ["Where is this?", "C’est où ?", "这是哪里？", "どこですか？", "Где это?"], "Meinen Standort verwenden": ["Use my location", "Utiliser ma position", "使用我的位置", "現在地を使う", "Использовать моё местоположение"], "Noch kein Ort gewählt": ["No place chosen yet", "Aucun lieu choisi", "尚未选择地点", "まだ場所が選ばれていません", "Место ещё не выбрано"], "Ort festgelegt ✓": ["Place set ✓", "Lieu défini ✓", "地点已设置 ✓", "場所を設定しました ✓", "Место задано ✓"], "Der Ort der Unterhaltung ist öffentlich und wird auf etwa 100 m gerundet. Dein eigener Standort bleibt privat.": ["The place of the discussion is public and rounded to about 100 m. Your own location stays private.", "Le lieu de la discussion est public et arrondi à environ 100 m. Ta propre position reste privée.", "讨论的地点是公开的，并会取整到约 100 米。你自己的位置保持私密。", "議論の場所は公開され、約100 mに丸められます。あなた自身の位置情報は公開されません。", "Место обсуждения публично и округляется примерно до 100 м. Твоё собственное местоположение остаётся приватным."], "Erster Beitrag (optional)": ["First post (optional)", "Premier message (facultatif)", "第一条帖子（可选）", "最初の投稿（任意）", "Первое сообщение (необязательно)"], "Was möchtest du sagen?": ["What would you like to say?", "Que veux-tu dire ?", "你想说什么？", "何を伝えたいですか？", "Что ты хочешь сказать?"], "Wird angelegt …": ["Creating …", "Création …", "创建中……", "作成中 …", "Создание …"], "Sag danke für einen guten Beitrag.": ["Say thanks for a good post.", "Dis merci pour un bon message.", "为一条好帖子说声谢谢。", "良い投稿にお礼を伝えましょう。", "Скажи спасибо за хорошее сообщение."], "Hilfreich": ["Helpful", "Utile", "有帮助", "役に立つ", "Полезно"], "Klug": ["Smart", "Malin", "聪明", "賢い", "Умно"], "Lustig": ["Funny", "Drôle", "有趣", "おもしろい", "Смешно"], "Danke": ["Thanks", "Merci", "谢谢", "ありがとう", "Спасибо"], "Silber": ["Silver", "Argent", "银", "シルバー", "Серебро"], "Gold": ["Gold", "Or", "金", "ゴールド", "Золото"], "Platin": ["Platinum", "Platine", "白金", "プラチナ", "Платина"], "Auszeichnung vergeben": ["Award given", "Distinction donnée", "已送出奖励", "称号を贈りました", "Награда вручена"], "Teilen & Sichern": ["Share & Back up", "Partager et sauvegarder", "分享与备份", "共有とバックアップ", "Поделиться и сохранить"], "Alles als Datei speichern": ["Save everything as a file", "Tout enregistrer en fichier", "全部保存为文件", "すべてファイルで保存", "Сохранить всё в файл"], "Zeitanker": ["Time anchor", "Ancre temporelle", "时间锚点", "タイムアンカー", "Временной якорь"], "Dieser Fingerabdruck lässt sich in einer Blockchain oder per OpenTimestamps veröffentlichen und beweist später, dass diese Unterhaltungen zu diesem Zeitpunkt existierten.": ["This fingerprint can be published on a blockchain or via OpenTimestamps and later proves that these discussions existed at this point in time.", "Cette empreinte peut être publiée sur une blockchain ou via OpenTimestamps et prouvera plus tard que ces discussions existaient à ce moment-là.", "这个指纹可以发布到区块链或通过 OpenTimestamps 发布，日后可证明这些讨论在此刻已经存在。", "このフィンガープリントはブロックチェーンやOpenTimestampsで公開でき、これらの議論がこの時点で存在したことを後から証明します。", "Этот отпечаток можно опубликовать в блокчейне или через OpenTimestamps; он позже докажет, что эти обсуждения существовали в этот момент."], "Kopieren": ["Copy", "Copier", "复制", "コピー", "Копировать"], "Kopiert": ["Copied", "Copié", "已复制", "コピーしました", "Скопировано"], "Kopieren geht hier nicht.": ["Copying does not work here.", "La copie ne fonctionne pas ici.", "这里无法复制。", "ここではコピーできません。", "Здесь копирование не работает."], "Diese Datei ist keine gültige Outernet-Datei.": ["This file is not a valid Outernet file.", "Ce fichier n’est pas un fichier Outernet valide.", "这不是有效的 Outernet 文件。", "このファイルは有効なOuternetファイルではありません。", "Это не корректный файл Outernet."], "Nichts Neues in dieser Datei.": ["Nothing new in this file.", "Rien de nouveau dans ce fichier.", "这个文件里没有新内容。", "このファイルに新しい内容はありません。", "В этом файле нет ничего нового."], "Gespeichert": ["Saved", "Enregistré", "已保存", "保存しました", "Сохранено"], "Datei gespeichert. Schicke sie weiter.": ["File saved. Send it on.", "Fichier enregistré. Envoie-le.", "文件已保存。把它发出去吧。", "ファイルを保存しました。送ってあげましょう。", "Файл сохранён. Отправь его дальше."], "Dein Tiername": ["Your animal name", "Ton nom d’animal", "你的动物昵称", "あなたの動物の名前", "Твоё имя животного"], "Sicherung": ["Backup", "Sauvegarde", "备份", "バックアップ", "Резервная копия"], "Mit dem Sicherungs-Code kannst du auf einem neuen Gerät weitermachen und bleibst derselbe Tiername in deinen Unterhaltungen.": ["With the backup code you can continue on a new device and keep the same animal name in your discussions.", "Avec le code de sauvegarde, tu peux continuer sur un nouvel appareil et garder le même nom d’animal dans tes discussions.", "用备份码，你可以在新设备上继续使用，并在你的讨论中保持同一个动物昵称。", "バックアップコードがあれば、新しい端末でも続けられ、あなたの議論では同じ動物の名前のままです。", "С кодом резервной копии можно продолжить на новом устройстве и сохранить то же имя животного в своих обсуждениях."], "Sicherungs-Code anzeigen": ["Show backup code", "Afficher le code de sauvegarde", "显示备份码", "バックアップコードを表示", "Показать код резервной копии"], "Code eingeben": ["Enter code", "Saisir le code", "输入备份码", "コードを入力", "Ввести код"], "Darstellung": ["Appearance", "Apparence", "外观", "表示", "Оформление"], "Farbschema": ["Color scheme", "Thème de couleur", "配色", "配色", "Цветовая схема"], "Automatisch": ["Automatic", "Automatique", "自动", "自動", "Авто"], "Hell": ["Light", "Clair", "浅色", "ライト", "Светлая"], "Dunkel": ["Dark", "Sombre", "深色", "ダーク", "Тёмная"], "Größere Schrift": ["Larger text", "Texte plus grand", "更大的字体", "大きな文字", "Крупный шрифт"], "Fragen und Antworten": ["Questions and answers", "Questions et réponses", "常见问题", "よくある質問", "Вопросы и ответы"], "Einführung wiederholen": ["Repeat introduction", "Revoir l’introduction", "重新查看介绍", "紹介をもう一度見る", "Повторить знакомство"], "Daten löschen": ["Delete data", "Supprimer les données", "删除数据", "データを削除", "Удалить данные"], "Entfernt alles von diesem Gerät. Ohne Sicherungs-Code kommst du nicht mehr an deine Tiernamen.": ["Removes everything from this device. Without the backup code you cannot get your animal names back.", "Supprime tout de cet appareil. Sans code de sauvegarde, tu ne retrouveras plus tes noms d’animaux.", "将从此设备上移除所有内容。没有备份码，你就无法找回你的动物昵称。", "この端末からすべて削除します。バックアップコードがないと動物の名前は戻りません。", "Удаляет всё с этого устройства. Без кода резервной копии вернуть имена животных не получится."], "Alles von diesem Gerät löschen": ["Delete everything from this device", "Tout supprimer de cet appareil", "删除此设备上的所有内容", "この端末のすべてを削除", "Удалить всё с этого устройства"], "Sprache": ["Language", "Langue", "语言", "言語", "Язык"], "Dein Sicherungs-Code": ["Your backup code", "Ton code de sauvegarde", "你的备份码", "あなたのバックアップコード", "Твой код резервной копии"], "Bewahre ihn sicher auf, zum Beispiel im Passwort-Manager oder ausgedruckt. Zeige ihn niemandem. Wer ihn hat, kann als du schreiben.": ["Keep it safe, for example in a password manager or printed out. Show it to nobody. Whoever has it can write as you.", "Conserve-le en lieu sûr, par exemple dans un gestionnaire de mots de passe ou imprimé. Ne le montre à personne. Qui l’a peut écrire en ton nom.", "请妥善保管，例如放进密码管理器或打印出来。不要给任何人看。拿到它的人可以冒充你发言。", "パスワード管理アプリや印刷物などで安全に保管してください。誰にも見せないでください。持っている人はあなたとして書き込めます。", "Храни его в надёжном месте, например в менеджере паролей или на бумаге. Никому не показывай. Тот, у кого он есть, может писать от твоего имени."], "Als Textdatei": ["As text file", "En fichier texte", "保存为文本文件", "テキストファイル", "В текстовый файл"], "Kopieren geht hier nicht. Markiere den Code mit dem Finger.": ["Copying does not work here. Select the code with your finger.", "La copie ne fonctionne pas ici. Sélectionne le code avec le doigt.", "这里无法复制。请用手指选中备份码。", "ここではコピーできません。コードを指で選択してください。", "Здесь копирование не работает. Выдели код пальцем."], "Outernet Sicherungs-Code (geheim halten):": ["Outernet backup code (keep secret):", "Code de sauvegarde Outernet (à garder secret) :", "Outernet 备份码（请保密）：", "Outernet バックアップコード（秘密にしてください）：", "Код резервной копии Outernet (держи в секрете):"], "Gib den Sicherungs-Code ein (64 Zeichen). Leerzeichen sind egal.": ["Enter the backup code (64 characters). Spaces do not matter.", "Saisis le code de sauvegarde (64 caractères). Les espaces n’ont pas d’importance.", "请输入备份码（64 个字符）。空格无关紧要。", "バックアップコード（64文字）を入力してください。スペースは無視されます。", "Введи код резервной копии (64 символа). Пробелы не важны."], "Sicherungs-Code": ["Backup code", "Code de sauvegarde", "备份码", "バックアップコード", "Код резервной копии"], "Wiederherstellen": ["Restore", "Restaurer", "恢复", "復元", "Восстановить"], "Das ist kein gültiger Code. Prüfe, ob alle 64 Zeichen da sind.": ["That is not a valid code. Check that all 64 characters are there.", "Ce n’est pas un code valide. Vérifie que les 64 caractères sont présents.", "这不是有效的备份码。请检查是否包含全部 64 个字符。", "無効なコードです。64文字すべてあるか確認してください。", "Это недопустимый код. Проверь, что все 64 символа на месте."], "Wiederhergestellt": ["Restored", "Restauré", "已恢复", "復元しました", "Восстановлено"], "Muss ich mich anmelden?": ["Do I have to sign in?", "Dois-je me connecter ?", "我需要登录吗？", "ログインは必要ですか？", "Нужно ли входить?"], "Nein. Es gibt kein Konto, keine E-Mail und keine Telefonnummer.": ["No. There is no account, no email and no phone number.", "Non. Il n’y a ni compte, ni e-mail, ni numéro de téléphone.", "不需要。没有账号，没有邮箱，也不需要手机号。", "いいえ。アカウント、メール、電話番号はありません。", "Нет. Нет ни аккаунта, ни e-mail, ни номера телефона."], "Wer sieht, was ich schreibe?": ["Who sees what I write?", "Qui voit ce que j’écris ?", "谁能看到我写的内容？", "書いたものは誰が見ますか？", "Кто видит, что я пишу?"], "Alle, die die Unterhaltung öffnen. Dein Name ist ein Tiername wie „Fuchs 42“. Er ist in jeder Unterhaltung anders.": ["Everyone who opens the discussion. Your name is an animal name like “Fox 42”. It is different in every discussion.", "Tous ceux qui ouvrent la discussion. Ton nom est un nom d’animal comme « Renard 42 ». Il est différent dans chaque discussion.", "所有打开这个讨论的人。你的名字是类似“狐狸 42”的动物昵称，每个讨论里都不同。", "その議論を開いた人は誰でも見られます。あなたの名前は「キツネ42」のような動物の名前で、議論ごとに違います。", "Все, кто открывает обсуждение. Твоё имя — имя животного, например «Лиса 42». В каждом обсуждении оно разное."], "Kann man mich erkennen?": ["Can people identify me?", "Peut-on m’identifier ?", "别人能认出我吗？", "私だと分かってしまいますか？", "Могут ли меня узнать?"], "Nicht an deinem Namen. Aber: Schreibe keine echten Namen, Adressen oder Telefonnummern. Was du schreibst, bleibt lesbar.": ["Not by your name. But: do not write real names, addresses or phone numbers. What you write stays readable.", "Pas par ton nom. Mais n’écris ni vrais noms, ni adresses, ni numéros de téléphone. Ce que tu écris reste lisible.", "不会通过你的名字。但请不要写真实姓名、地址或电话号码。你写的内容会一直可见。", "名前からは分かりません。ただし、本名、住所、電話番号は書かないでください。書いた内容は読めるまま残ります。", "Не по имени. Но не пиши настоящие имена, адреса и номера телефонов. Написанное остаётся читаемым."], "Kann ich Beiträge löschen?": ["Can I delete posts?", "Puis-je supprimer des messages ?", "我能删除帖子吗？", "投稿は削除できますか？", "Можно ли удалять сообщения?"], "Nicht sicher. Weil keine Firma dahintersteht, haben andere schon Kopien. Überlege deshalb vor dem Senden.": ["Not reliably. Because no company is behind it, others may already have copies. So think before you send.", "Pas de façon fiable. Comme aucune entreprise n’est derrière, d’autres ont déjà des copies. Réfléchis donc avant d’envoyer.", "无法可靠删除。因为背后没有公司，别人可能已有副本。所以发送前请想清楚。", "確実には削除できません。運営会社がないため、他の人がすでにコピーを持っているかもしれません。送信前によく考えてください。", "Надёжно — нет. За платформой нет компании, и у других уже могут быть копии. Поэтому подумай перед отправкой."], "Was bedeutet „auffällig“?": ["What does “suspicious” mean?", "Que signifie « suspect » ?", "“可疑”是什么意思？", "「不審」とは何ですか？", "Что значит «подозрительно»?"], "Der Beitrag sieht aus wie Spam oder wie viele gleiche Texte auf einmal. Er ist nur ausgeblendet, nicht gelöscht. Du kannst ihn einblenden.": ["The post looks like spam or like many identical texts at once. It is only hidden, not deleted. You can show it.", "Le message ressemble à du spam ou à beaucoup de textes identiques à la fois. Il est seulement masqué, pas supprimé. Tu peux l’afficher.", "这条帖子看起来像垃圾信息，或像同时出现很多相同的文字。它只是被隐藏，并未删除。你可以显示它。", "投稿がスパムや同じ文章の大量投稿のように見えます。非表示になっているだけで、削除されてはいません。表示することもできます。", "Сообщение похоже на спам или на множество одинаковых текстов сразу. Оно лишь скрыто, не удалено. Его можно показать."], "Was kosten Auszeichnungen?": ["What do awards cost?", "Combien coûtent les récompenses ?", "奖励要花钱吗？", "称号は有料ですか？", "Сколько стоят награды?"], "Wie bekomme ich eine Unterhaltung zu Freunden?": ["How do I get a discussion to friends?", "Comment envoyer une discussion à des amis ?", "怎样把讨论发给朋友？", "議論を友だちに渡すには？", "Как передать обсуждение друзьям?"], "Öffne sie und tippe auf „Als Datei teilen“. Schicke die Datei per Messenger oder Mail.": ["Open it and tap “Share as file”. Send the file by messenger or email.", "Ouvre-la et touche « Partager en fichier ». Envoie le fichier par messagerie ou e-mail.", "打开它，点按“作为文件分享”，再通过聊天软件或邮件发送这个文件。", "開いて「ファイルで共有」をタップし、ファイルをメッセンジャーやメールで送ります。", "Открой его и нажми «Поделиться файлом». Отправь файл мессенджером или почтой."], "Wie funktioniert der QR-Aufkleber?": ["How does the QR sticker work?", "Comment fonctionne l’autocollant QR ?", "二维码贴纸怎么用？", "QRステッカーの仕組みは？", "Как работает QR-наклейка?"], "Was, wenn ich mein Handy verliere?": ["What if I lose my phone?", "Et si je perds mon téléphone ?", "如果手机丢了怎么办？", "スマホをなくしたら？", "Что, если я потеряю телефон?"], "Mit dem Sicherungs-Code unter „Ich“ kommst du auf einem neuen Gerät weiter.": ["With the backup code under “Me” you can continue on a new device.", "Avec le code de sauvegarde sous « Moi », tu peux continuer sur un nouvel appareil.", "用“我”中的备份码，你可以在新设备上继续。", "「自分」のバックアップコードで、新しい端末でも続けられます。", "С кодом резервной копии в разделе «Я» можно продолжить на новом устройстве."], "Wirklich alles löschen?": ["Really delete everything?", "Vraiment tout supprimer ?", "确定要全部删除吗？", "本当にすべて削除しますか？", "Точно удалить всё?"], "Alle Unterhaltungen und dein Sicherungs-Code verschwinden von diesem Gerät. Das kann nicht rückgängig gemacht werden.": ["All discussions and your backup code disappear from this device. This cannot be undone.", "Toutes les discussions et ton code de sauvegarde disparaissent de cet appareil. Cette action est irréversible.", "所有讨论和你的备份码都会从此设备上消失，且无法撤销。", "すべての議論とバックアップコードがこの端末から消えます。元に戻せません。", "Все обсуждения и твой код резервной копии исчезнут с этого устройства. Это нельзя отменить."], "Ja, löschen": ["Yes, delete", "Oui, supprimer", "是，删除", "はい、削除", "Да, удалить"], "Abbrechen": ["Cancel", "Annuler", "取消", "キャンセル", "Отмена"], "Beispiele geladen": ["Examples loaded", "Exemples chargés", "示例已加载", "サンプルを読み込みました", "Примеры загружены"], "Fertig! Tippe auf eine Unterhaltung, um zu starten.": ["Done! Tap a discussion to get started.", "C’est prêt ! Touche une discussion pour commencer.", "完成！点按一个讨论开始吧。", "完了！議論をタップして始めましょう。", "Готово! Нажми на обсуждение, чтобы начать."], "Fertig. Willkommen bei Outernet.": ["Done. Welcome to Outernet.", "Terminé. Bienvenue sur Outernet.", "完成。欢迎使用 Outernet。", "完了です。Outernetへようこそ。", "Готово. Добро пожаловать в Outernet."], "Dein Browser ist zu alt": ["Your browser is too old", "Ton navigateur est trop ancien", "你的浏览器版本太旧", "ブラウザが古すぎます", "Твой браузер слишком старый"], "Bitte aktualisiere Chrome, Edge, Safari oder Firefox auf die neueste Version und öffne die Datei erneut.": ["Please update Chrome, Edge, Safari or Firefox to the latest version and open the file again.", "Mets à jour Chrome, Edge, Safari ou Firefox vers la dernière version et rouvre le fichier.", "请把 Chrome、Edge、Safari 或 Firefox 更新到最新版本，然后重新打开此文件。", "Chrome、Edge、Safari、Firefoxを最新版に更新して、もう一度ファイルを開いてください。", "Обнови Chrome, Edge, Safari или Firefox до последней версии и открой файл снова."], "Speichern im Browser ist hier nicht möglich. Nutze „Alles als Datei speichern“.": ["Saving in the browser is not possible here. Use “Save everything as a file”.", "L’enregistrement dans le navigateur n’est pas possible ici. Utilise « Tout enregistrer en fichier ».", "这里无法在浏览器中保存。请使用“全部保存为文件”。", "ここではブラウザへの保存ができません。「すべてファイルで保存」を使ってください。", "Сохранение в браузере здесь невозможно. Используй «Сохранить всё в файл»."], "Outernet-Unterhaltung.": ["Outernet discussion.", "Discussion Outernet.", "Outernet 讨论。", "Outernetの議論。", "Обсуждение Outernet."], "Du kannst diese Datei einfach lesen. Zum Mitmachen öffne sie über „Teilen → Datei öffnen“ in der Outernet-App (app.html). Alle Beiträge sind signiert und lassen sich prüfen.": ["You can simply read this file. To join in, open it via “Share → Open file” in the Outernet app (app.html). All posts are signed and can be verified.", "Tu peux simplement lire ce fichier. Pour participer, ouvre-le via « Partager → Ouvrir un fichier » dans l’app Outernet (app.html). Tous les messages sont signés et vérifiables.", "你可以直接阅读这个文件。想参与讨论，请在 Outernet 应用（app.html）中通过“分享 → 打开文件”打开它。所有帖子都有签名，可以验证。", "このファイルはそのまま読めます。参加するには、Outernetアプリ（app.html）の「共有 → ファイルを開く」から開いてください。すべての投稿は署名されており、検証できます。", "Этот файл можно просто читать. Чтобы участвовать, открой его в приложении Outernet (app.html) через «Поделиться → Открыть файл». Все сообщения подписаны и проверяемы."], "Seitenstand beim Start": ["Page snapshot at the start", "Version de la page au départ", "开始时的页面快照", "開始時のページ", "Страница на момент начала"], "Start": ["Started", "Début", "开始", "開始", "Начато"], "Kürzel": ["Short ID", "Code court", "短码", "短縮ID", "Код"], "Übersetzt aus {l} · Original anzeigen": ["Translated from {l} · Show original", "Traduit depuis : {l} · Voir l’original", "已从{l}翻译 · 显示原文", "{l}から翻訳 · 原文を表示", "Переведено с языка: {l} · Показать оригинал"], "Original ({l}) · Übersetzung anzeigen": ["Original ({l}) · Show translation", "Original ({l}) · Voir la traduction", "原文（{l}）· 显示译文", "原文（{l}）· 翻訳を表示", "Оригинал ({l}) · Показать перевод"], "Übersetzung wird geladen …": ["Translating …", "Traduction …", "翻译中……", "翻訳中 …", "Перевод …"], "Übersetzung nicht verfügbar. Wie aktivieren?": ["Translation unavailable. How to enable?", "Traduction indisponible. Comment l’activer ?", "暂无法翻译。如何启用？", "翻訳は利用できません。有効にするには？", "Перевод недоступен. Как включить?"], "Übersetzer einrichten": ["Set up translator", "Configurer le traducteur", "设置翻译器", "翻訳を設定", "Настроить переводчик"], "Für die automatische Übersetzung lädt dein Browser einmalig ein Sprachpaket auf dein Gerät. Danach läuft sie ohne Internet und privat.": ["For automatic translation your browser downloads a language pack to your device once. After that it runs offline and privately.", "Pour la traduction automatique, ton navigateur télécharge une fois un pack de langue sur ton appareil. Ensuite, elle fonctionne hors ligne et en privé.", "自动翻译需要浏览器一次性把语言包下载到你的设备。之后可离线、私密地使用。", "自動翻訳のため、ブラウザが言語パックを一度だけ端末にダウンロードします。その後はオフラインで、プライベートに動作します。", "Для автоматического перевода браузер один раз загрузит языковой пакет на твоё устройство. Дальше перевод работает офлайн и приватно."], "Übersetzung": ["Translation", "Traduction", "翻译", "翻訳", "Перевод"], "Fremde Sprachen automatisch übersetzen": ["Translate foreign languages automatically", "Traduire automatiquement les langues étrangères", "自动翻译外语", "外国語を自動で翻訳する", "Автоматически переводить иностранные языки"], "Die Übersetzung läuft direkt auf deinem Gerät und bleibt privat. Du siehst bei jedem Text, dass er übersetzt wurde, und kannst jederzeit das Original lesen.": ["Translation runs directly on your device and stays private. You can see on every text that it was translated and can read the original at any time.", "La traduction s’exécute directement sur ton appareil et reste privée. Tu vois sur chaque texte qu’il a été traduit et tu peux lire l’original à tout moment.", "翻译直接在你的设备上运行，保持私密。每段文字都会标明已被翻译，你可以随时查看原文。", "翻訳は端末上で直接行われ、プライベートです。翻訳された文章にはその表示があり、いつでも原文を読めます。", "Перевод выполняется прямо на твоём устройстве и остаётся приватным. У каждого текста видно, что он переведён, и в любой момент можно прочитать оригинал."], "Übersetzer im Browser: verfügbar (privat, auf dem Gerät)": ["Browser translator: available (private, on device)", "Traducteur du navigateur : disponible (privé, sur l’appareil)", "浏览器翻译器：可用（私密，在设备上运行）", "ブラウザの翻訳機能：利用可能（プライベート、端末内）", "Переводчик в браузере: доступен (приватно, на устройстве)"], "Übersetzer im Browser: nicht verfügbar": ["Browser translator: not available", "Traducteur du navigateur : indisponible", "浏览器翻译器：不可用", "ブラウザの翻訳機能：利用できません", "Переводчик в браузере: недоступен"], "Eigener Übersetzungs-Server (optional)": ["Own translation server (optional)", "Serveur de traduction personnel (facultatif)", "自有翻译服务器（可选）", "独自の翻訳サーバー（任意）", "Собственный сервер перевода (необязательно)"], "Adresse eines LibreTranslate-Servers. Achtung: Dann werden Texte an diesen Server gesendet.": ["Address of a LibreTranslate server. Note: texts are then sent to that server.", "Adresse d’un serveur LibreTranslate. Attention : les textes sont alors envoyés à ce serveur.", "LibreTranslate 服务器地址。注意：文本将被发送到该服务器。", "LibreTranslateサーバーのアドレス。注意：文章がそのサーバーに送信されます。", "Адрес сервера LibreTranslate. Внимание: тексты будут отправляться на этот сервер."], "Wie funktioniert die Übersetzung?": ["How does translation work?", "Comment fonctionne la traduction ?", "翻译是怎么工作的？", "翻訳の仕組みは？", "Как работает перевод?"], "Texte in einer anderen Sprache werden automatisch in deine Sprache übersetzt. Darunter steht, dass sie übersetzt wurden. Mit einem Tipp siehst du den Originaltext. Erkannt werden Deutsch, Englisch, Französisch, Chinesisch, Japanisch und Russisch.": ["Texts in another language are translated into your language automatically. A note below says they were translated. One tap shows the original text. German, English, French, Chinese, Japanese and Russian are recognised.", "Les textes dans une autre langue sont traduits automatiquement dans ta langue. Une mention dessous indique qu’ils ont été traduits. Un toucher affiche le texte original. Sont reconnus : allemand, anglais, français, chinois, japonais et russe.", "其他语言的文字会自动翻译成你的语言，下方会注明已翻译。轻点一下即可查看原文。可识别德语、英语、法语、中文、日语和俄语。", "他の言語の文章は自動であなたの言語に翻訳され、下に翻訳済みと表示されます。タップすると原文を読めます。ドイツ語、英語、フランス語、中国語、日本語、ロシア語を認識します。", "Тексты на другом языке автоматически переводятся на твой язык, а ниже указано, что они переведены. Одно нажатие показывает оригинал. Распознаются немецкий, английский, французский, китайский, японский и русский."], "Offline teilen": ["Share offline", "Partager hors ligne", "离线分享", "オフラインで共有", "Офлайн-обмен"], "Orte (QR)": ["Places (QR)", "Lieux (QR)", "地点（二维码）", "場所（QR）", "Места (QR)"], "Browser-Plugin": ["Browser plugin", "Plugin de navigateur", "浏览器插件", "ブラウザプラグイン", "Плагин для браузера"], "Bereich": ["Area", "Section", "分区", "エリア", "Раздел"], "Von Mensch zu Mensch": ["Person to person", "De personne à personne", "人与人之间", "人から人へ", "От человека к человеку"], "Verbinden": ["Connect", "Se connecter", "连接", "つなぐ", "Подключиться"], "Scannen": ["Scan", "Scanner", "扫描", "スキャン", "Сканировать"], "Kamera": ["Camera", "Caméra", "相机", "カメラ", "Камера"], "Geschwindigkeit": ["Speed", "Vitesse", "速度", "速度", "Скорость"], "Langsamer": ["Slower", "Plus lent", "慢一点", "ゆっくり", "Медленнее"], "Schneller": ["Faster", "Plus rapide", "快一点", "速く", "Быстрее"], "Kamera starten": ["Start camera", "Démarrer la caméra", "启动相机", "カメラを起動", "Включить камеру"], "Foto eines Codes wählen": ["Choose a photo of a code", "Choisir une photo d’un code", "选择二维码照片", "コードの写真を選ぶ", "Выбрать фото кода"], "Beim Verbinden werden nur öffentliche Beiträge ausgetauscht. Dein Sicherungs-Code bleibt privat.": ["Only public posts are exchanged when connecting. Your backup code stays private.", "Seuls les messages publics sont échangés lors de la connexion. Ton code de sauvegarde reste privé.", "连接时只交换公开的帖子。你的备份码保持私密。", "つなぐときに交換されるのは公開投稿だけです。バックアップコードは非公開のままです。", "При подключении обмениваются только публичные сообщения. Твой код резервной копии остаётся приватным."], "Fertig": ["Done", "Terminé", "完成", "完了", "Готово"], "Bild {a} von {n}": ["Frame {a} of {n}", "Image {a} sur {n}", "第 {a} 帧，共 {n} 帧", "{a} / {n} コマ", "Кадр {a} из {n}"], "{k} große Anhänge sind nicht dabei. Sie kommen per Datei oder Netzwerk.": ["{k} large attachments are not included. They travel by file or network.", "{k} grandes pièces jointes ne sont pas incluses. Elles passent par fichier ou réseau.", "不含 {k} 个大附件，它们通过文件或网络传递。", "大きな添付 {k} 件は含まれません。ファイルかネットワークで送ります。", "{k} больших вложений не включены. Они передаются файлом или через сеть."], "Empfangen: {a} von {n}": ["Received: {a} of {n}", "Reçu : {a} sur {n}", "已接收：{a}/{n}", "受信：{a} / {n}", "Получено: {a} из {n}"], "Dieser Code ist ungültig.": ["This code is invalid.", "Ce code n’est pas valide.", "这个二维码无效。", "このコードは無効です。", "Этот код недействителен."], "Fertig! {n} neue Beiträge in {t} Unterhaltungen.": ["Done! {n} new posts in {t} discussions.", "Terminé ! {n} nouveaux messages dans {t} discussions.", "完成！{t} 个讨论中新增 {n} 条帖子。", "完了！{t} 件の議論に新しい投稿 {n} 件。", "Готово! Новых сообщений: {n}, обсуждений: {t}."], "Nichts Neues. Ihr habt schon dasselbe.": ["Nothing new. You already have the same.", "Rien de nouveau. Vous avez déjà la même chose.", "没有新内容。你们已经拥有相同的内容。", "新しいものはありません。すでに同じ内容です。", "Ничего нового. У вас уже одно и то же."], "Keine Kamera verfügbar. Nutze stattdessen eine Datei oder das Netzwerk.": ["No camera available. Use a file or the network instead.", "Aucune caméra disponible. Utilise plutôt un fichier ou le réseau.", "没有可用的相机。请改用文件或网络。", "カメラが使えません。代わりにファイルかネットワークを使ってください。", "Камера недоступна. Используй файл или сеть."], "Kamera wird gestartet …": ["Starting camera …", "Démarrage de la caméra …", "正在启动相机……", "カメラを起動中 …", "Запуск камеры …"], "Kein Zugriff auf die Kamera. Das kannst du in den Einstellungen erlauben.": ["No access to the camera. You can allow it in settings.", "Pas d’accès à la caméra. Tu peux l’autoriser dans les réglages.", "无法访问相机。你可以在设置中允许。", "カメラにアクセスできません。設定で許可できます。", "Нет доступа к камере. Это можно разрешить в настройках."], "Kein QR-Code im Bild gefunden.": ["No QR code found in the image.", "Aucun code QR trouvé dans l’image.", "图片中没有找到二维码。", "画像にQRコードが見つかりません。", "На изображении нет QR-кода."], "Unterhaltung hinzugefügt": ["Discussion added", "Discussion ajoutée", "讨论已添加", "議論を追加しました", "Обсуждение добавлено"], "Unterhaltung geöffnet": ["Discussion opened", "Discussion ouverte", "已打开讨论", "議論を開きました", "Обсуждение открыто"], "Unterhaltung noch nicht hier": ["Discussion not here yet", "Discussion pas encore là", "讨论还不在这里", "議論はまだここにありません", "Обсуждения здесь пока нет"], "Aufkleber": ["Sticker", "Autocollant", "贴纸", "ステッカー", "Наклейка"], "Hier mitreden": ["Join in here", "Participe ici", "在这里参与", "ここで参加", "Участвуй здесь"], "Adresse der App (optional)": ["App address (optional)", "Adresse de l’app (facultatif)", "应用地址（可选）", "アプリのアドレス（任意）", "Адрес приложения (необязательно)"], "Wenn du app.html im Netz bereitstellst, öffnet auch die normale Handy-Kamera den Aufkleber.": ["If you publish app.html online, even the normal phone camera opens the sticker.", "Si tu mets app.html en ligne, l’appareil photo normal du téléphone ouvre aussi l’autocollant.", "如果你把 app.html 放到网上，手机自带相机也能打开这张贴纸。", "app.htmlをネットで公開すれば、普通のスマホカメラでもステッカーを開けます。", "Если выложить app.html в сеть, наклейку откроет и обычная камера телефона."], "Drucken": ["Print", "Imprimer", "打印", "印刷", "Печать"], "Als Bild speichern": ["Save as image", "Enregistrer comme image", "保存为图片", "画像として保存", "Сохранить как изображение"], "Die Unterhaltung ist zu groß für einen Code. Der Code enthält nur den Verweis.": ["The discussion is too large for one code. The code contains only the reference.", "La discussion est trop grande pour un seul code. Le code ne contient que la référence.", "这个讨论太大，无法放进一个二维码。二维码只包含引用。", "議論が大きすぎて1つのコードに入りません。コードには参照だけが入ります。", "Обсуждение слишком большое для одного кода. В коде только ссылка на него."], "Der Code ist zu groß. Kürze die Adressen.": ["The code is too large. Shorten the addresses.", "Le code est trop grand. Raccourcis les adresses.", "二维码太大了。请缩短地址。", "コードが大きすぎます。アドレスを短くしてください。", "Код слишком большой. Сократи адреса."], "QR-Code für einen Ort": ["QR code for a place", "Code QR pour un lieu", "地点二维码", "場所のQRコード", "QR-код для места"], "Klebe den Code an eine Tür, Haltestelle oder Wand. Wer ihn scannt, bekommt die Unterhaltung direkt aufs Gerät, auch ohne Internet.": ["Stick the code on a door, bus stop or wall. Whoever scans it gets the discussion straight onto their device, even without internet.", "Colle le code sur une porte, un arrêt de bus ou un mur. Qui le scanne reçoit la discussion directement sur son appareil, même sans internet.", "把二维码贴在门、车站或墙上。扫描它的人会直接把讨论存到设备上，即使没有网络。", "ドアやバス停、壁にコードを貼りましょう。スキャンした人は、インターネットがなくても議論をそのまま端末に受け取れます。", "Наклей код на дверь, остановку или стену. Кто его отсканирует, получит обсуждение прямо на устройство, даже без интернета."], "Unterhaltung wählen": ["Choose a discussion", "Choisir une discussion", "选择讨论", "議論を選ぶ", "Выбрать обсуждение"], "Starte zuerst eine Unterhaltung für einen Ort.": ["First start a discussion for a place.", "Lance d’abord une discussion pour un lieu.", "请先为一个地点发起讨论。", "まず場所の議論を始めてください。", "Сначала начни обсуждение для места."], "Einen Aufkleber scannen": ["Scan a sticker", "Scanner un autocollant", "扫描贴纸", "ステッカーをスキャン", "Сканировать наклейку"], "Scanne den QR-Code an einem Ort, um mitzureden.": ["Scan the QR code at a place to join in.", "Scanne le code QR sur place pour participer.", "在地点扫描二维码即可参与。", "場所でQRコードをスキャンして参加しましょう。", "Отсканируй QR-код на месте, чтобы присоединиться."], "Öffne chrome://extensions und schalte den Entwicklermodus ein.": ["Open chrome://extensions and turn on developer mode.", "Ouvre chrome://extensions et active le mode développeur.", "打开 chrome://extensions 并开启开发者模式。", "chrome://extensions を開き、デベロッパーモードをオンにします。", "Открой chrome://extensions и включи режим разработчика."], "Wähle „Entpackte Erweiterung laden“ und den Ordner „extension“.": ["Choose “Load unpacked” and the “extension” folder.", "Choisis « Charger l’extension non empaquetée » et le dossier « extension ».", "选择“加载已解压的扩展程序”和“extension”文件夹。", "「パッケージ化されていない拡張機能を読み込む」を選び、「extension」フォルダを指定します。", "Выбери «Загрузить распакованное расширение» и папку «extension»."], "Verstanden": ["Got it", "Compris", "知道了", "分かりました", "Понятно"], "Jetzt verbinden": ["Connect now", "Se connecter maintenant", "立即连接", "今すぐつなぐ", "Соединиться сейчас"], "Wichtig: Neues kommt von Mensch zu Mensch": ["Important: news travels from person to person", "Important : les nouveautés passent de personne à personne", "重要：新内容靠人与人之间传递", "大切：新しい内容は人から人へ届きます", "Важно: новое приходит от человека к человеку"], "Das ist dein Stand von heute": ["This is your state as of today", "Voici ton état d’aujourd’hui", "这是你今天的状态", "これは今日のあなたの状態です", "Это твоё состояние на сегодня"], "Dein Beitrag ist noch bei dir": ["Your post is still only with you", "Ton message n’est encore que chez toi", "你的帖子目前只在你这里", "あなたの投稿はまだあなただけのものです", "Твоё сообщение пока только у тебя"], "Je öfter du teilst, desto aktueller": ["The more you share, the more up to date", "Plus tu partages, plus c’est à jour", "分享越频繁，内容越新", "共有するほど、内容は新しくなります", "Чем чаще делишься, тем актуальнее"], "Verbinde dich mit möglichst vielen verschiedenen Menschen. Jeder Austausch bringt dir neue Beiträge und gibt deine weiter.": ["Connect with as many different people as possible. Every exchange brings you new posts and passes yours on.", "Connecte-toi avec un maximum de personnes différentes. Chaque échange t’apporte de nouveaux messages et transmet les tiens.", "尽量与更多不同的人连接。每次交换都会带来新帖子，也会把你的帖子传出去。", "できるだけ多くの違う人とつながりましょう。交換のたびに新しい投稿が届き、あなたの投稿も広がります。", "Подключайся к как можно большему числу разных людей. Каждый обмен приносит тебе новые сообщения и передаёт твои дальше."], "Der Aufkleber zeigt nur den Anfang": ["The sticker only shows the beginning", "L’autocollant ne montre que le début", "贴纸只包含开头部分", "ステッカーには最初の部分しか入っていません", "Наклейка содержит только начало"], "Mit Menschen vor Ort reden": ["Talk with people on site", "Parler avec les gens sur place", "与当地的人交流", "その場にいる人と話そう", "Говори с людьми на месте"], "Scannen & mitreden": ["Scan & join in", "Scanner et participer", "扫描并参与", "スキャンして参加", "Сканируй и участвуй"], "App öffnen": ["Open the app", "Ouvrir l’app", "打开应用", "アプリを開く", "Открыть приложение"], "Teilen → Orte": ["Share → Places", "Partager → Lieux", "分享 → 地点", "共有 → 場所", "Поделиться → Места"], "Code scannen": ["Scan the code", "Scanner le code", "扫描二维码", "コードをスキャン", "Сканировать код"], "Kein Konto · Auch offline": ["No account · Works offline", "Sans compte · Aussi hors ligne", "无需账号 · 离线可用", "アカウント不要 · オフラインでも", "Без аккаунта · Работает офлайн"], "Farbe": ["Color", "Couleur", "颜色", "色", "Цвет"], "Erweitert": ["Advanced", "Avancé", "高级", "詳細設定", "Дополнительно"], "App als Datei teilen": ["Share app as file", "Partager l’app en fichier", "把应用作为文件分享", "アプリをファイルで共有", "Поделиться приложением файлом"], "Beide Handys gleichzeitig": ["Both phones at the same time", "Les deux téléphones en même temps", "两部手机同时进行", "2台のスマホで同時に", "Оба телефона одновременно"], "Haltet die Bildschirme gegeneinander, etwa eine Handbreit Abstand.": ["Hold the screens facing each other, about a hand’s width apart.", "Tenez les écrans l’un en face de l’autre, à environ une main de distance.", "让两部手机的屏幕相对，相距约一掌宽。", "画面を向かい合わせ、手のひら1枚ぶんほど離します。", "Держите экраны друг напротив друга на расстоянии около ладони."], "Dein Bildschirm zeigt deinen Code. Die Frontkamera oben liest den Code der anderen Person.": ["Your screen shows your code. The front camera at the top reads the other person’s code.", "Ton écran affiche ton code. La caméra frontale en haut lit le code de l’autre personne.", "你的屏幕显示你的二维码，顶部的前置摄像头读取对方的二维码。", "あなたの画面にはあなたのコードが表示されます。上部のフロントカメラが相手のコードを読み取ります。", "Твой экран показывает твой код. Фронтальная камера сверху считывает код другого человека."], "Bewegt die Handys langsam, bis beide Balken voll sind.": ["Move the phones slowly until both bars are full.", "Bougez les téléphones lentement jusqu’à ce que les deux barres soient pleines.", "缓慢移动手机，直到两个进度条都满。", "両方のバーがいっぱいになるまで、ゆっくり動かします。", "Медленно двигайте телефоны, пока обе полосы не заполнятся."], "1. Dein Bildschirm zeigt deinen Code": ["1. Your screen shows your code", "1. Ton écran affiche ton code", "1. 你的屏幕显示你的二维码", "1. あなたの画面にコードを表示", "1. Твой экран показывает твой код"], "2. Die Frontkamera liest den Code des anderen": ["2. The front camera reads the other’s code", "2. La caméra frontale lit le code de l’autre", "2. 前置摄像头读取对方的二维码", "2. フロントカメラが相手のコードを読み取る", "2. Фронтальная камера считывает код другого"], "Kamera wechseln": ["Switch camera", "Changer de caméra", "切换摄像头", "カメラを切り替え", "Сменить камеру"], "Frontkamera aktiv. Sie liest den Code der anderen Person.": ["Front camera active. It reads the other person’s code.", "Caméra frontale active. Elle lit le code de l’autre personne.", "前置摄像头已启用，正在读取对方的二维码。", "フロントカメラ作動中。相手のコードを読み取ります。", "Фронтальная камера включена. Она считывает код другого человека."], "Rückkamera aktiv. Halte sie auf den Code.": ["Rear camera active. Point it at the code.", "Caméra arrière active. Dirige-la vers le code.", "后置摄像头已启用。请对准二维码。", "背面カメラ作動中。コードに向けてください。", "Задняя камера включена. Наведи её на код."], "QR-Code": ["QR code", "Code QR", "二维码", "QRコード", "QR-код"], "Handys gegeneinander halten": ["Hold phones facing each other", "Tenir les téléphones face à face", "让手机互相对准", "スマホを向かい合わせる", "Поднести телефоны друг к другу"], "WLAN": ["Wi-Fi", "Wi-Fi", "WLAN", "Wi-Fi", "Wi-Fi"], "Im selben Netz, auch iPhone ↔ Android": ["On the same network, iPhone ↔ Android too", "Sur le même réseau, aussi iPhone ↔ Android", "同一网络内，iPhone 与 Android 也可", "同じネットワークで、iPhone ↔ Androidも", "В одной сети, в том числе iPhone ↔ Android"], "WLAN-Verbindung": ["Wi-Fi connection", "Connexion Wi-Fi", "WLAN 连接", "Wi-Fi接続", "Подключение по Wi-Fi"], "Beide Handys müssen im selben WLAN sein, oder ein Handy teilt seinen Hotspot. Das funktioniert auch zwischen iPhone und Android.": ["Both phones must be on the same Wi-Fi, or one phone shares its hotspot. This also works between iPhone and Android.", "Les deux téléphones doivent être sur le même Wi-Fi, ou l’un partage son point d’accès. Cela fonctionne aussi entre iPhone et Android.", "两部手机必须连接同一个 WLAN，或其中一部开启热点。iPhone 与 Android 之间也可使用。", "両方のスマホが同じWi-Fiに接続しているか、片方がホットスポットを共有している必要があります。iPhoneとAndroid間でも使えます。", "Оба телефона должны быть в одной сети Wi-Fi, или один делится точкой доступа. Это работает и между iPhone и Android."], "Einladen": ["Invite", "Inviter", "邀请", "招待する", "Пригласить"], "Beitreten": ["Join", "Rejoindre", "加入", "参加する", "Присоединиться"], "Mein Code": ["My code", "Mon code", "我的代码", "自分のコード", "Мой код"], "Code des anderen einfügen": ["Paste the other’s code", "Coller le code de l’autre", "粘贴对方的代码", "相手のコードを貼り付け", "Вставить код другого"], "Übernehmen": ["Apply", "Appliquer", "应用", "適用", "Применить"], "Code wird erstellt …": ["Creating code …", "Création du code …", "正在生成代码……", "コードを作成中 …", "Создаём код …"], "Verbindung wird aufgebaut …": ["Connecting …", "Établissement de la connexion …", "正在建立连接……", "接続中 …", "Устанавливаем соединение …"], "Verbunden. Beiträge werden ausgetauscht …": ["Connected. Exchanging posts …", "Connecté. Échange des messages …", "已连接，正在交换帖子……", "接続しました。投稿を交換中 …", "Соединено. Обмен сообщениями …"], "Übertragen: {a} von {n}": ["Transferred: {a} of {n}", "Transféré : {a} sur {n}", "已传输：{a}/{n}", "転送：{a} / {n}", "Передано: {a} из {n}"], "Verbindung fehlgeschlagen. Seid ihr im selben WLAN? Manche Netze, zum Beispiel Gast-WLAN, blockieren die Verbindung.": ["Connection failed. Are you on the same Wi-Fi? Some networks, such as guest Wi-Fi, block the connection.", "Échec de la connexion. Êtes-vous sur le même Wi-Fi ? Certains réseaux, comme le Wi-Fi invité, bloquent la connexion.", "连接失败。你们在同一个 WLAN 吗？有些网络（例如访客 WLAN）会阻止连接。", "接続に失敗しました。同じWi-Fiにいますか？ゲストWi-Fiなど、接続をブロックするネットワークもあります。", "Не удалось соединиться. Вы в одной сети Wi-Fi? Некоторые сети, например гостевые, блокируют соединение."], "Nochmal versuchen": ["Try again", "Réessayer", "重试", "もう一度試す", "Повторить"], "Dein Browser unterstützt keine WLAN-Verbindung.": ["Your browser does not support Wi-Fi connections.", "Ton navigateur ne prend pas en charge la connexion Wi-Fi.", "你的浏览器不支持 WLAN 连接。", "お使いのブラウザはWi-Fi接続に対応していません。", "Твой браузер не поддерживает соединение по Wi-Fi."], "Verbunden": ["Connected", "Connecté", "已连接", "接続しました", "Соединено"], "Bereit zum Teilen": ["Ready to share", "Prêt à partager", "可以分享了", "共有の準備ができました", "Готово к отправке"], "Tauscht automatisch alle Unterhaltungen aus, die einer von euch kennt, auch die, die ihr früher von anderen bekommen habt. So verbreiten sich Unterhaltungen von Mensch zu Mensch.": ["Automatically exchange all conversations either of you knows, including those you got from others earlier. This is how discussions spread from person to person.", "Échangez automatiquement toutes les conversations que l’un de vous connaît, y compris celles reçues d’autres personnes. Ainsi, les discussions se propagent de personne à personne.", "自动交换你们任何一方知道的所有对话，包括之前从别人那里收到的。讨论就这样在人与人之间传播。", "どちらかが知っているすべての会話を自動で交換します。以前ほかの人から受け取ったものも含みます。こうして議論は人から人へ広がります。", "Автоматически обменивайтесь всеми обсуждениями, которые знает кто-то из вас, в том числе полученными раньше от других. Так обсуждения распространяются от человека к человеку."], "Gib Unterhaltungen von Mensch zu Mensch weiter, ganz ohne Firma dazwischen.": ["Pass on conversations from person to person, with no company in between.", "Transmets les conversations de personne à personne, sans entreprise au milieu.", "在人与人之间传递对话，中间没有公司。", "会話を人から人へ渡しましょう。間に企業はいません。", "Передавай обсуждения от человека к человеку, без компании посередине."], "Dateien": ["Files", "Fichiers", "文件", "ファイル", "Файлы"], "Schicke Dateien per Messenger, Mail oder USB. Wer sie öffnet, kann sofort mitmachen, ohne Installation.": ["Send files by messenger, email or USB. Anyone who opens them can join right away, no installation needed.", "Envoie des fichiers par messagerie, e-mail ou USB. Quiconque les ouvre peut participer tout de suite, sans installation.", "通过聊天软件、邮件或 U 盘发送文件。打开的人可以立即参与，无需安装。", "メッセンジャー、メール、USBでファイルを送りましょう。開いた人はインストール不要ですぐ参加できます。", "Отправляй файлы мессенджером, почтой или флешкой. Кто их откроет, сможет сразу участвовать, без установки."], "Eine einzelne Unterhaltung teilst du direkt in der Unterhaltung mit „Als Datei teilen“.": ["To share a single discussion, open it and tap “Share as file”.", "Pour partager une seule discussion, ouvre-la et touche « Partager en fichier ».", "要分享单个讨论，请打开它并点按“作为文件分享”。", "1つの議論を共有するには、それを開いて「ファイルとして共有」をタップします。", "Чтобы поделиться одним обсуждением, открой его и нажми «Поделиться файлом»."], "Die Unterhaltung ist noch nicht auf deinem Gerät. Verbinde dich mit jemandem, der sie hat.": ["The discussion is not on your device yet. Connect with someone who has it.", "La discussion n’est pas encore sur ton appareil. Connecte-toi avec quelqu’un qui l’a.", "这个讨论还不在你的设备上。请与拥有它的人连接。", "この議論はまだあなたの端末にありません。持っている人とつながってください。", "Этого обсуждения ещё нет на твоём устройстве. Соединись с тем, у кого оно есть."], "Mit dem Plugin öffnest du von jeder Webseite aus die passende Unterhaltung in der App. Es braucht keinen Server.": ["With the plugin you open the matching discussion in the app from any web page. No server needed.", "Avec le plugin, tu ouvres depuis n’importe quelle page web la discussion correspondante dans l’app. Aucun serveur nécessaire.", "通过插件，你可以在任何网页上打开应用中对应的讨论。不需要服务器。", "プラグインを使うと、どのWebページからでもアプリ内の該当する議論を開けます。サーバーは不要です。", "С плагином ты открываешь нужное обсуждение в приложении с любой веб-страницы. Сервер не нужен."], "Trage in den Plugin-Einstellungen diese Adresse der App ein:": ["In the plugin settings, enter this address of the app:", "Dans les réglages du plugin, saisis cette adresse de l’app :", "在插件设置中填入此应用地址：", "プラグインの設定に、このアプリのアドレスを入力します：", "В настройках плагина введи этот адрес приложения:"], "Rechtsklick auf eine Webseite oder markierten Text, dann „Mit Outernet besprechen“.": ["Right-click a web page or selected text, then “Talk it over with Outernet”.", "Fais un clic droit sur une page web ou un texte sélectionné, puis « En parler avec Outernet ».", "在网页或选中的文字上右键，然后选择“用 Outernet 讨论”。", "Webページまたは選択したテキストを右クリックし、「Outernetで話す」を選びます。", "Щёлкни правой кнопкой по странице или выделенному тексту и выбери «Обсудить в Outernet»."], "Im Aufkleber steckt die Unterhaltung als QR-Code. Wer ihn scannt, bekommt sie aufs Gerät. Erstelle ihn unter Teilen → Orte (QR), drucke ihn aus und klebe ihn an den Ort.": ["The sticker holds the discussion as a QR code. Anyone who scans it gets it on their device. Create it under Share → Places (QR), print it and stick it at the place.", "L’autocollant contient la discussion sous forme de code QR. Quiconque le scanne la reçoit sur son appareil. Crée-le sous Partager → Lieux (QR), imprime-le et colle-le sur place.", "贴纸里以二维码形式包含这个讨论。扫描的人会把它收到自己的设备上。在“分享 → 地点（QR）”中创建，打印后贴在该地点。", "ステッカーには議論がQRコードとして入っています。スキャンした人の端末に届きます。「共有 → 場所（QR）」で作成し、印刷して場所に貼ります。", "В наклейке обсуждение хранится как QR-код. Кто его отсканирует, получит его на устройство. Создай наклейку в разделе «Поделиться → Места (QR)», распечатай и наклей на месте."], "Standort nicht verfügbar. „In der Nähe“ braucht deinen Standort.": ["Location unavailable. “Nearby” needs your location.", "Position indisponible. « À proximité » a besoin de ta position.", "无法获取位置。“附近”需要你的位置。", "位置情報を取得できません。「近く」には位置情報が必要です。", "Местоположение недоступно. Для «Рядом» нужно твоё местоположение."], "Themen": ["Topics", "Thèmes", "主题", "トピック", "Темы"], "Themenbereiche": ["Topic areas", "Espaces thématiques", "主题区", "トピックエリア", "Тематические разделы"], "Themenbereich": ["Topic area", "Espace thématique", "主题区", "トピックエリア", "Тематический раздел"], "Jeder kann einen Themenbereich anlegen. Alle dürfen darin eigene Unterhaltungen starten.": ["Anyone can create a topic area. Everyone may start their own discussions in it.", "Chacun peut créer un espace thématique. Tout le monde peut y lancer ses propres discussions.", "任何人都可以创建主题区，所有人都可以在其中发起自己的讨论。", "誰でもトピックエリアを作れます。誰でもその中で自分の議論を始められます。", "Любой может создать тематический раздел. Все могут начинать в нём свои обсуждения."], "Themenbereich anlegen": ["Create topic area", "Créer un espace thématique", "创建主题区", "トピックエリアを作る", "Создать раздел"], "Noch kein Themenbereich": ["No topic area yet", "Aucun espace thématique", "还没有主题区", "トピックエリアはまだありません", "Разделов пока нет"], "Lege den ersten an oder verbinde dich mit jemandem, der schon welche hat.": ["Create the first one or connect with someone who already has some.", "Crée le premier ou connecte-toi avec quelqu’un qui en a déjà.", "创建第一个，或与已有主题区的人连接。", "最初のものを作るか、すでに持っている人とつながりましょう。", "Создай первый или соединись с тем, у кого они уже есть."], "Dieser Themenbereich ist noch nicht hier": ["This topic area is not here yet", "Cet espace thématique n’est pas encore ici", "这个主题区还不在这里", "このトピックエリアはまだここにありません", "Этого раздела здесь ещё нет"], "Verbinde dich mit jemandem, der ihn hat, unter „Teilen“.": ["Connect with someone who has it under “Share”.", "Connecte-toi avec quelqu’un qui l’a, sous « Partager ».", "请在“分享”中与拥有它的人连接。", "「共有」から、持っている人とつながってください。", "Соединись с тем, у кого он есть, в разделе «Поделиться»."], "Verhaltensregeln": ["Rules of conduct", "Règles de conduite", "行为规则", "行動ルール", "Правила поведения"], "Unterhaltung hier starten": ["Start a discussion here", "Lancer une discussion ici", "在此发起讨论", "ここで議論を始める", "Начать обсуждение здесь"], "Noch keine Unterhaltung": ["No discussion yet", "Aucune discussion", "还没有讨论", "議論はまだありません", "Обсуждений пока нет"], "Starte die erste in diesem Themenbereich.": ["Start the first one in this topic area.", "Lance la première dans cet espace thématique.", "在这个主题区发起第一个讨论。", "このトピックエリアで最初の議論を始めましょう。", "Начни первое обсуждение в этом разделе."], "Name": ["Name", "Nom", "名称", "名前", "Название"], "Beschreibung": ["Description", "Description", "描述", "説明", "Описание"], "z. B. Stadt & Verkehr": ["e.g. City & Transport", "p. ex. Ville et transports", "例如：城市与交通", "例：街と交通", "напр. Город и транспорт"], "Worum geht es in diesem Themenbereich?": ["What is this topic area about?", "De quoi parle cet espace thématique ?", "这个主题区是关于什么的？", "このトピックエリアは何についてですか？", "О чём этот раздел?"], "Was ist hier erlaubt, was nicht?": ["What is allowed here and what is not?", "Qu’est-ce qui est autorisé ici, et qu’est-ce qui ne l’est pas ?", "这里允许什么，不允许什么？", "ここで許されること、許されないことは？", "Что здесь можно, а что нельзя?"], "Beschreibung und Regeln sind Pflicht und erscheinen für alle sichtbar. Sie lassen sich später nicht ändern.": ["Description and rules are required and visible to everyone. They cannot be changed later.", "La description et les règles sont obligatoires et visibles par tous. Elles ne peuvent pas être modifiées plus tard.", "描述和规则为必填项，对所有人可见，之后无法修改。", "説明とルールは必須で、全員に表示されます。後から変更できません。", "Описание и правила обязательны и видны всем. Позже их нельзя изменить."], "Bitte gib mindestens 2 Zeichen ein.": ["Please enter at least 2 characters.", "Saisis au moins 2 caractères.", "请至少输入 2 个字符。", "2文字以上入力してください。", "Введи не менее 2 символов."], "Bitte schreibe mindestens 10 Zeichen. Das Feld ist Pflicht.": ["Please write at least 10 characters. This field is required.", "Écris au moins 10 caractères. Ce champ est obligatoire.", "请至少写 10 个字符，此项为必填。", "10文字以上入力してください。この項目は必須です。", "Напиши не менее 10 символов. Поле обязательно."], "Einen Themenbereich": ["A topic area", "Un espace thématique", "一个主题区", "トピックエリア", "Раздел"], "Eigener Bereich mit Regeln. Andere starten darin Unterhaltungen.": ["Your own area with rules. Others start discussions in it.", "Ton propre espace avec des règles. Les autres y lancent des discussions.", "带规则的专属区域，其他人可在其中发起讨论。", "ルール付きの自分のエリア。他の人がその中で議論を始めます。", "Свой раздел с правилами. Другие начинают в нём обсуждения."], "Alle Themenbereiche": ["All topic areas", "Tous les espaces thématiques", "所有主题区", "すべてのトピックエリア", "Все разделы"], "Kein Themenbereich": ["No topic area", "Aucun espace thématique", "无主题区", "トピックエリアなし", "Без раздела"], "Themenbereich (optional)": ["Topic area (optional)", "Espace thématique (facultatif)", "主题区（可选）", "トピックエリア（任意）", "Раздел (необязательно)"], "Regeln dieses Themenbereichs": ["Rules of this topic area", "Règles de cet espace thématique", "本主题区的规则", "このトピックエリアのルール", "Правила этого раздела"], "Mit dem Start akzeptierst du diese Regeln.": ["By starting, you accept these rules.", "En lançant, tu acceptes ces règles.", "发起即表示你接受这些规则。", "開始すると、これらのルールに同意したことになります。", "Начиная, ты принимаешь эти правила."], "Themenbereich angelegt": ["Topic area created", "Espace thématique créé", "主题区已创建", "トピックエリアを作成しました", "Раздел создан"], "Ihr tauscht zwei kurze Codes aus, zum Beispiel per Messenger. Ein QR-Code ist nicht nötig.": ["You exchange two short codes, for example by messenger. No QR code is needed.", "Vous échangez deux codes courts, par exemple par messagerie. Aucun code QR n’est nécessaire.", "你们交换两段短代码，例如通过聊天软件。不需要二维码。", "短いコードを2つ、たとえばメッセンジャーで交換します。QRコードは不要です。", "Вы обмениваетесь двумя короткими кодами, например в мессенджере. QR-код не нужен."], "Ich schicke zuerst den Code": ["I send the code first", "J’envoie d’abord le code", "我先发送代码", "先にコードを送る", "Сначала отправляю код я"], "Ich habe einen Code bekommen": ["I received a code", "J’ai reçu un code", "我收到了代码", "コードを受け取った", "Я получил код"], "1. Schicke diesen Code an das andere Handy": ["1. Send this code to the other phone", "1. Envoie ce code à l’autre téléphone", "1. 把这段代码发给对方手机", "1. このコードを相手のスマホに送る", "1. Отправь этот код на другой телефон"], "2. Füge die Antwort des anderen ein": ["2. Paste the other phone’s reply", "2. Colle la réponse de l’autre téléphone", "2. 粘贴对方的回复代码", "2. 相手の返信を貼り付ける", "2. Вставь ответ другого телефона"], "1. Füge den Code des anderen ein": ["1. Paste the other phone’s code", "1. Colle le code de l’autre téléphone", "1. 粘贴对方手机的代码", "1. 相手のコードを貼り付ける", "1. Вставь код другого телефона"], "2. Schicke diesen Antwort-Code zurück": ["2. Send this reply code back", "2. Renvoie ce code de réponse", "2. 把这段回复代码发回去", "2. この返信コードを送り返す", "2. Отправь этот ответный код обратно"], "Code teilen": ["Share code", "Partager le code", "分享代码", "コードを共有", "Поделиться кодом"], "Aus Zwischenablage einfügen": ["Paste from clipboard", "Coller depuis le presse-papiers", "从剪贴板粘贴", "クリップボードから貼り付け", "Вставить из буфера"], "Warte auf das andere Handy …": ["Waiting for the other phone …", "En attente de l’autre téléphone …", "正在等待对方手机……", "相手のスマホを待っています …", "Ждём другой телефон …"], "Lieber per QR-Code?": ["Prefer a QR code?", "Plutôt par code QR ?", "更喜欢二维码？", "QRコードのほうがいい？", "Лучше через QR-код?"], "Mit Kamera-Freigabe versuchen": ["Try with camera permission", "Réessayer avec l’autorisation de la caméra", "授权相机后重试", "カメラを許可して試す", "Повторить с доступом к камере"], "Die Freigabe hilft manchen Netzen, die Handys zu verbinden. Die Kamera wird nicht benutzt.": ["The permission helps some networks connect the phones. The camera is not used.", "L’autorisation aide certains réseaux à connecter les téléphones. La caméra n’est pas utilisée.", "此授权可帮助某些网络连接两部手机。不会使用相机。", "この許可により、一部のネットワークでスマホ同士がつながりやすくなります。カメラは使いません。", "Разрешение помогает некоторым сетям соединить телефоны. Камера не используется."], "Einfügen geht hier nicht. Halte das Feld gedrückt und wähle „Einfügen“.": ["Pasting is not possible here. Long-press the field and choose “Paste”.", "Le collage n’est pas possible ici. Appuie longuement sur le champ et choisis « Coller ».", "此处无法粘贴。长按输入框并选择“粘贴”。", "ここでは貼り付けできません。欄を長押しして「貼り付け」を選んでください。", "Вставка здесь недоступна. Нажми и удерживай поле и выбери «Вставить»."], "Dieser Code passt nicht. Prüfe, ob du den ganzen Code kopiert hast.": ["This code does not match. Check that you copied the whole code.", "Ce code ne correspond pas. Vérifie que tu as copié le code en entier.", "这个代码不匹配。请检查是否复制了完整的代码。", "このコードは合いません。コード全体をコピーしたか確認してください。", "Этот код не подходит. Проверь, что скопирован весь код."], "In der Nähe suchen": ["Find people nearby", "Chercher à proximité", "搜索附近的人", "近くを探す", "Искать рядом"], "Handys im selben WLAN finden sich selbst. Jeder bestätigt den Austausch per Knopf.": ["Phones on the same Wi-Fi find each other. Everyone confirms the exchange with a button.", "Les téléphones du même Wi-Fi se trouvent seuls. Chacun confirme l’échange par un bouton.", "同一 WLAN 中的手机会自动找到彼此。每个人都用按钮确认交换。", "同じWi-Fiのスマホは自動で見つかります。全員がボタンで交換を確認します。", "Телефоны в одной сети Wi-Fi находят друг друга сами. Каждый подтверждает обмен кнопкой."], "Oder ohne Vermittler, mit Code": ["Or without a relay, using a code", "Ou sans intermédiaire, avec un code", "或不使用中介，改用代码", "または仲介なしでコードを使う", "Или без посредника, с кодом"], "1 Person in der Nähe": ["1 person nearby", "1 personne à proximité", "附近有 1 人", "近くに1人", "1 человек рядом"], "{n} Personen in der Nähe": ["{n} people nearby", "{n} personnes à proximité", "附近有 {n} 人", "近くに{n}人", "Рядом {n} чел."], "Niemand in der Nähe. Die anderen müssen dieselbe Seite öffnen.": ["Nobody nearby. The others need to open this page too.", "Personne à proximité. Les autres doivent ouvrir la même page.", "附近没有人。其他人也需要打开同一页面。", "近くに誰もいません。相手も同じページを開く必要があります。", "Рядом никого. Другие тоже должны открыть эту страницу."], "Austausch mit 1 Person bestätigen": ["Confirm exchange with 1 person", "Confirmer l’échange avec 1 personne", "确认与 1 人交换", "1人との交換を確認", "Подтвердить обмен с 1 человеком"], "Austausch mit {n} Personen bestätigen": ["Confirm exchange with {n} people", "Confirmer l’échange avec {n} personnes", "确认与 {n} 人交换", "{n}人との交換を確認", "Подтвердить обмен с {n} чел."], "Austausch bestätigen": ["Confirm exchange", "Confirmer l’échange", "确认交换", "交換を確認", "Подтвердить обмен"], "Warte auf die Bestätigung der anderen …": ["Waiting for the others to confirm …", "En attente de la confirmation des autres …", "正在等待其他人确认……", "他の人の確認を待っています …", "Ждём подтверждения от других …"], "verbunden": ["connected", "connecté", "已连接", "接続済み", "соединено"], "bereit": ["ready", "prêt", "已就绪", "準備完了", "готов"], "Gleiches Wort (optional)": ["Same word (optional)", "Même mot (facultatif)", "相同的词（可选）", "同じ言葉（任意）", "Одно и то же слово (необязательно)"], "Falls ihr euch nicht findet: Alle tippen dasselbe Wort.": ["If you cannot find each other: everyone types the same word.", "Si vous ne vous trouvez pas : tout le monde saisit le même mot.", "如果找不到彼此：所有人输入同一个词。", "見つからない場合は、全員が同じ言葉を入力してください。", "Если не находите друг друга: все вводят одно и то же слово."], "Vermittler-Adresse": ["Relay address", "Adresse de l’intermédiaire", "中介地址", "仲介サーバーのアドレス", "Адрес посредника"], "Ein Vermittler hilft den Handys im selben WLAN, sich zu finden. Er sieht keine Beiträge. Trage die Adresse ein, die dir jemand gibt oder die du selbst betreibst (Ordner „relay“).": ["A relay helps phones on the same Wi-Fi find each other. It never sees posts. Enter the address someone gives you or one you run yourself (folder “relay”).", "Un intermédiaire aide les téléphones du même Wi-Fi à se trouver. Il ne voit aucun message. Saisis l’adresse que quelqu’un te donne ou celle que tu héberges toi-même (dossier « relay »).", "中介帮助同一 WLAN 中的手机找到彼此，它看不到任何帖子。请填入别人给你的地址，或你自己运行的地址（文件夹“relay”）。", "仲介サーバーは同じWi-Fiのスマホが互いを見つけるのを助けます。投稿は見えません。誰かから教わったアドレス、または自分で運用するアドレス（フォルダ「relay」）を入力してください。", "Посредник помогает телефонам в одной сети Wi-Fi найти друг друга. Он не видит сообщений. Введи адрес, который тебе дали, или свой собственный (папка «relay»)."], "Speichern": ["Save", "Enregistrer", "保存", "保存", "Сохранить"], "Adresse ungültig": ["Invalid address", "Adresse invalide", "地址无效", "アドレスが無効です", "Недопустимый адрес"], "Vermittler nicht erreichbar. Prüfe die Adresse und dein Internet.": ["Relay not reachable. Check the address and your internet.", "Intermédiaire injoignable. Vérifie l’adresse et ta connexion.", "无法连接中介。请检查地址和网络。", "仲介サーバーに接続できません。アドレスとインターネットを確認してください。", "Посредник недоступен. Проверь адрес и интернет."], "Suche läuft …": ["Searching …", "Recherche en cours …", "正在搜索……", "検索中 …", "Идёт поиск …"], "Niemand hat bestätigt oder die Verbindung kam nicht zustande. Versuche es nochmal.": ["Nobody confirmed or the connection failed. Try again.", "Personne n’a confirmé ou la connexion a échoué. Réessaie.", "没有人确认，或连接失败。请重试。", "誰も確認しなかったか、接続に失敗しました。もう一度試してください。", "Никто не подтвердил или соединение не удалось. Попробуй ещё раз."], "{p} neue Beiträge in {t} Unterhaltungen.": ["{p} new posts in {t} discussions.", "{p} nouveaux messages dans {t} discussions.", "{t} 个讨论中有 {p} 条新帖子。", "{t}件の議論に新しい投稿が{p}件あります。", "Новых сообщений: {p} в обсуждениях: {t}."], "Ausgetauscht mit 1 Person": ["Exchanged with 1 person", "Échange avec 1 personne", "已与 1 人交换", "1人と交換しました", "Обмен с 1 человеком"], "Ausgetauscht mit {n} Personen": ["Exchanged with {n} people", "Échange avec {n} personnes", "已与 {n} 人交换", "{n}人と交換しました", "Обмен с {n} чел."], "Du gehörst dazu": ["You belong here", "Tu fais partie du groupe", "你是其中一员", "あなたも仲間です", "Ты — часть сообщества"], "Outernet lebt von Menschen, die sich treffen und teilen. Das ist bei dir zusammengekommen.": ["Outernet lives from people who meet and share. This is what has come together for you.", "Outernet vit de personnes qui se rencontrent et partagent. Voici ce qui s’est réuni chez toi.", "Outernet 因人们相遇和分享而生。这是你这里汇集的内容。", "Outernet は、出会い、分かち合う人たちによって成り立っています。あなたのところに集まったものはこちらです。", "Outernet живёт благодаря людям, которые встречаются и делятся. Вот что собралось у тебя."], "Austausche mit Menschen": ["Exchanges with people", "Échanges avec des personnes", "与他人的交换", "人との交換", "Обмены с людьми"], "App als HTML herunterladen": ["Download app as HTML", "Télécharger l’app en HTML", "以 HTML 下载应用", "アプリをHTMLでダウンロード", "Скачать приложение в HTML"], "Die HTML-Datei ist die ganze App. Du kannst sie speichern oder teilen.": ["The HTML file is the whole app. You can save or share it.", "Le fichier HTML est l’app entière. Tu peux l’enregistrer ou la partager.", "HTML 文件就是整个应用。你可以保存或分享它。", "HTMLファイルがアプリそのものです。保存も共有もできます。", "HTML-файл — это всё приложение. Его можно сохранить или передать."], "Austausch abgebrochen: Die andere Seite hat zu viel Ungültiges gesendet.": ["Exchange stopped: the other side sent too much invalid data.", "Échange interrompu : l’autre côté a envoyé trop de données invalides.", "交换已中止：对方发送了太多无效数据。", "交換を中止しました：相手が無効なデータを大量に送りました。", "Обмен прерван: другая сторона прислала слишком много недопустимых данных."], "Austausch abgebrochen: Die andere Seite hat zu viel auf einmal gesendet.": ["Exchange stopped: the other side sent too much at once.", "Échange interrompu : l’autre côté a envoyé trop de données d’un coup.", "交换已中止：对方一次发送了太多内容。", "交換を中止しました：相手が一度に送りすぎました。", "Обмен прерван: другая сторона прислала слишком много за раз."], "{n} als Spam verdächtig ausgeblendet": ["{n} hidden as suspected spam", "{n} masqués car suspects de spam", "{n} 条疑似垃圾内容已隐藏", "スパムの疑いで{n}件を非表示", "{n} скрыто как подозрительный спам"], "Anzeigen": ["Show", "Afficher", "显示", "表示", "Показать"], "Verdacht auf Spam.": ["Suspected spam.", "Spam suspecté.", "疑似垃圾内容。", "スパムの疑いがあります。", "Подозрение на спам."], "Unterhaltung ausblenden": ["Hide conversation", "Masquer la conversation", "隐藏对话", "会話を非表示にする", "Скрыть обсуждение"], "Diesen Beitrag ausblenden": ["Hide this post", "Masquer ce message", "隐藏此帖", "この投稿を非表示にする", "Скрыть это сообщение"], "Alles von dieser Person ausblenden": ["Hide everything from this person", "Masquer tout de cette personne", "隐藏此人的所有内容", "この人の投稿をすべて非表示にする", "Скрыть всё от этого человека"], "Das gilt nur auf deinem Gerät. Du kannst es unter „Ich“ rückgängig machen.": ["This only applies on your device. You can undo it under “Me”.", "Cela ne vaut que sur ton appareil. Tu peux l’annuler sous « Moi ».", "这只对你的设备有效。你可以在“我”里撤销。", "これはあなたの端末だけに適用されます。「自分」から元に戻せます。", "Это действует только на твоём устройстве. Отменить можно в разделе «Я»."], "Ausgeblendet.": ["Hidden.", "Masqué.", "已隐藏。", "非表示にしました。", "Скрыто."], "Alles wieder sichtbar.": ["Everything is visible again.", "Tout est de nouveau visible.", "已全部恢复显示。", "すべて再表示しました。", "Всё снова видно."], "Schutz und Sicherheit": ["Protection and security", "Protection et sécurité", "保护与安全", "保護とセキュリティ", "Защита и безопасность"], "Jeder Beitrag ist signiert und kostet etwas Rechenzeit. Fremde Daten werden streng geprüft, Verdächtiges wird eingeklappt.": ["Every post is signed and costs a little computing time. Foreign data is checked strictly, and anything suspicious is collapsed.", "Chaque message est signé et demande un peu de calcul. Les données étrangères sont strictement vérifiées et ce qui est suspect est replié.", "每条帖子都有签名，并需要一点计算时间。外来数据会被严格检查，可疑内容会被折叠。", "すべての投稿には署名があり、少し計算時間がかかります。外部のデータは厳しく検査され、疑わしいものは折りたたまれます。", "Каждое сообщение подписано и требует немного вычислений. Чужие данные строго проверяются, подозрительное сворачивается."], "Prüfsumme dieser App": ["Checksum of this app", "Somme de contrôle de cette app", "此应用的校验码", "このアプリのチェックサム", "Контрольная сумма этого приложения"], "Vergleiche sie mit der Prüfsumme der Person, von der du die App hast.": ["Compare it with the checksum of the person you got the app from.", "Compare-la avec celle de la personne dont tu as reçu l’app.", "请与你获得此应用的那个人的校验码对比。", "アプリを受け取った相手のチェックサムと比べてください。", "Сравни её с контрольной суммой того, от кого получил приложение."], "Erhaltene App-Datei prüfen": ["Check a received app file", "Vérifier un fichier d’app reçu", "检查收到的应用文件", "受け取ったアプリファイルを確認", "Проверить полученный файл приложения"], "App-Datei prüfen": ["Check app file", "Vérifier le fichier d’app", "检查应用文件", "アプリファイルを確認", "Проверка файла приложения"], "Die Datei konnte nicht gelesen werden.": ["The file could not be read.", "Le fichier n’a pas pu être lu.", "无法读取该文件。", "ファイルを読み込めませんでした。", "Не удалось прочитать файл."], "Die Datei ist identisch mit dieser App.": ["The file is identical to this app.", "Le fichier est identique à cette app.", "该文件与此应用完全相同。", "このファイルはこのアプリと同一です。", "Файл идентичен этому приложению."], "Achtung: Die Datei weicht von dieser App ab. Öffne sie nicht, wenn du der Quelle nicht traust.": ["Warning: the file differs from this app. Do not open it if you do not trust the source.", "Attention : le fichier diffère de cette app. Ne l’ouvre pas si tu ne fais pas confiance à la source.", "注意：该文件与此应用不同。如果你不信任来源，请不要打开。", "注意：このファイルはこのアプリと異なります。出どころを信頼できない場合は開かないでください。", "Внимание: файл отличается от этого приложения. Не открывай его, если не доверяешь источнику."], "Ausgeblendete Inhalte: {n}": ["Hidden items: {n}", "Éléments masqués : {n}", "已隐藏的内容：{n}", "非表示の項目：{n}", "Скрытых элементов: {n}"], "Alle wieder anzeigen": ["Show all again", "Tout réafficher", "全部重新显示", "すべて再表示", "Показать всё снова"], "Empfangen und Fortsetzen": ["Received and resuming", "Reçu et reprise", "接收与续传", "受信と再開", "Получено и продолжение"], "Hier siehst du, was du von anderen schon bekommen hast. Unterbrochene Übertragungen gehen beim nächsten Austausch an der gleichen Stelle weiter.": ["Here you see what you have already received from others. Interrupted transfers continue at the same place at the next exchange.", "Ici tu vois ce que tu as déjà reçu des autres. Les transferts interrompus reprennent au même endroit lors du prochain échange.", "这里显示你已从他人那里收到的内容。中断的传输会在下次交换时从原处继续。", "他の人から既に受け取ったものがここに表示されます。中断した転送は、次の交換で同じ場所から再開します。", "Здесь видно, что ты уже получил от других. Прерванные передачи продолжатся с того же места при следующем обмене."], "Noch offen: {p} Teile in {t} Unterhaltungen": ["Still open: {p} parts in {t} conversations", "Encore ouvert : {p} parties dans {t} conversations", "仍有 {p} 个部分未完成，涉及 {t} 个对话", "未完了：{t}件の会話に{p}個のパーツ", "Ещё не получено: {p} частей в {t} обсуждениях"], "Alles vollständig. Es fehlt nichts.": ["Everything is complete. Nothing is missing.", "Tout est complet. Rien ne manque.", "全部完整，没有缺失。", "すべてそろっています。足りないものはありません。", "Всё получено. Ничего не пропущено."], "Noch kein Austausch.": ["No exchange yet.", "Pas encore d’échange.", "还没有交换。", "まだ交換していません。", "Обменов пока не было."], "QR-Codes": ["QR codes", "Codes QR", "二维码", "QRコード", "QR-коды"], "abgeschlossen": ["complete", "terminé", "已完成", "完了", "завершено"], "unvollständig": ["incomplete", "incomplet", "不完整", "未完了", "не полностью"], "{a} von {n} Teilen": ["{a} of {n} parts", "{a} sur {n} parties", "{a} / {n} 个部分", "{n}個中{a}個", "{a} из {n} частей"], "Unterhaltung wird noch geladen": ["Conversation is still loading", "La conversation se charge encore", "对话仍在加载", "会話を読み込み中", "Обсуждение ещё загружается"], "Protokoll löschen": ["Clear log", "Effacer le journal", "清除记录", "記録を消す", "Очистить журнал"], "Diese Unterhaltung ist noch nicht vollständig. Es fehlen noch {n} Teile. Beim nächsten Austausch geht es hier weiter.": ["This conversation is not complete yet. {n} parts are still missing. It continues here at the next exchange.", "Cette conversation n’est pas encore complète. Il manque {n} parties. Elle continuera ici lors du prochain échange.", "此对话尚不完整，还缺少 {n} 个部分。下次交换时会从这里继续。", "この会話はまだ完全ではありません。あと{n}個足りません。次の交換でここから続きます。", "Это обсуждение ещё неполное. Не хватает {n} частей. При следующем обмене оно продолжится отсюда."], "Unterbrochen. {n} Beiträge sind schon da. Beim nächsten Austausch geht es an der gleichen Stelle weiter.": ["Interrupted. {n} posts have already arrived. The next exchange continues at the same place.", "Interrompu. {n} messages sont déjà arrivés. Le prochain échange reprend au même endroit.", "已中断。已收到 {n} 条内容。下次交换会从原处继续。", "中断しました。{n}件の投稿はすでに届いています。次の交換で同じ場所から続きます。", "Прервано. {n} сообщений уже получено. Следующий обмен продолжится с того же места."], "Unterbrochen": ["Interrupted", "Interrompu", "已中断", "中断しました", "Прервано"], "Empfangen: {a} von {n} · {k} neue Beiträge": ["Received: {a} of {n} · {k} new posts", "Reçu : {a} sur {n} · {k} nouveaux messages", "已接收：{a} / {n} · {k} 条新内容", "受信：{n}個中{a}個 · 新しい投稿{k}件", "Получено: {a} из {n} · новых сообщений: {k}"], "{k} Bilder passen nicht mehr in den Strom. Der Rest kommt per Netzwerk.": ["{k} frames no longer fit in the stream. The rest comes over the network.", "{k} images ne tiennent plus dans le flux. Le reste passe par le réseau.", "还有 {k} 帧放不进此数据流。其余内容请通过网络传送。", "{k}枚はストリームに収まりません。残りはネットワークで届きます。", "{k} кадров не помещаются в поток. Остальное придёт по сети."], "Jedes Bild enthält fertige Beiträge. Bricht es ab, bleibt das Empfangene erhalten und geht später weiter.": ["Every frame contains finished posts. If it breaks off, what was received is kept and continues later.", "Chaque image contient des messages complets. En cas de coupure, ce qui est reçu est conservé et reprend plus tard.", "每一帧都包含完整的内容。即使中断，已收到的部分也会保留，稍后继续。", "どのコードにも完成した投稿が入っています。中断しても受信分は残り、後で続きから再開できます。", "Каждый кадр содержит готовые сообщения. Если связь прервётся, полученное сохранится и продолжится позже."], "Noch offen: {p} Teile. Zeigt den Code nochmal, dann geht es weiter.": ["Still open: {p} parts. Show the code again to continue.", "Encore ouvert : {p} parties. Montrez à nouveau le code pour continuer.", "仍有 {p} 个部分未完成。请再次展示二维码以继续。", "未完了：{p}個のパーツ。もう一度コードを見せると続きから始まります。", "Ещё не получено: {p} частей. Покажите код снова, чтобы продолжить."], "Neue Auszeichnung freigeschaltet: {k}": ["New award unlocked: {k}", "Nouvelle distinction débloquée : {k}", "新奖励已解锁：{k}", "新しい称号が解放されました：{k}", "Открыта новая награда: {k}"], "{n} übrig": ["{n} left", "{n} restant(s)", "剩余 {n} 个", "残り{n}個", "осталось {n}"], "noch {n} Austausch": ["{n} more exchange(s)", "encore {n} échange(s)", "还需 {n} 次交换", "あと{n}回の交換", "ещё {n} обмен(ов)"], "Immer frei": ["Always free", "Toujours gratuit", "始终免费", "いつでも無料", "Всегда бесплатно"], "Besondere Auszeichnungen": ["Special awards", "Distinctions spéciales", "特别奖励", "特別な称号", "Особые награды"], "Besondere Auszeichnungen kosten nichts. Du verdienst sie, wenn du dich mit anderen Menschen austauschst. Sie sammeln sich bei dir an, bis du sie vergibst.": ["Special awards cost nothing. You earn them by exchanging with other people. They pile up until you give them out.", "Les distinctions spéciales sont gratuites. Tu les gagnes en échangeant avec d’autres personnes. Elles s’accumulent jusqu’à ce que tu les donnes.", "特别奖励完全免费。与他人交换即可获得，会一直累积，直到你送出。", "特別な称号は無料です。人と交換するともらえ、あげるまで貯まっていきます。", "Особые награды бесплатны. Ты получаешь их, обмениваясь с другими людьми. Они копятся, пока ты их не раздашь."], "Deine Auszeichnungen": ["Your awards", "Tes distinctions", "你的奖励", "あなたの称号", "Твои награды"], "Besondere Auszeichnungen sind kostenlos. Sie werden nach und nach freigeschaltet, je mehr du dich mit anderen austauschst.": ["Special awards are free. They unlock bit by bit the more you exchange with others.", "Les distinctions spéciales sont gratuites. Elles se débloquent peu à peu, plus tu échanges avec les autres.", "特别奖励免费。你与他人交换得越多，就会逐步解锁。", "特別な称号は無料です。人と交換するほど、少しずつ解放されます。", "Особые награды бесплатны. Они открываются постепенно, чем больше ты обмениваешься."], "Gezählte Austausche: {n}": ["Counted exchanges: {n}", "Échanges comptés : {n}", "已计入的交换：{n}", "カウントした交換：{n}", "Засчитано обменов: {n}"], "Datenmenge": ["Data volume", "Volume de données", "数据量", "データ量", "Объём данных"], "Bilder und Dateien können groß werden. Hier bestimmst du, was du empfängst. Was du jetzt nicht willst, bleibt beim Absender und kann später nachgeladen werden.": ["Images and files can get large. Here you decide what you receive. What you do not want now stays with the sender and can be loaded later.", "Les images et fichiers peuvent devenir volumineux. Ici tu décides ce que tu reçois. Ce que tu ne veux pas maintenant reste chez l’expéditeur et peut être chargé plus tard.", "图片和文件可能变得很大。在这里决定接收什么。暂时不想要的会留在发送者那里，之后可以补充下载。", "画像やファイルは大きくなることがあります。ここで受け取る内容を決めます。今いらないものは送り主に残り、後から読み込めます。", "Изображения и файлы могут стать большими. Здесь ты решаешь, что получать. Ненужное сейчас остаётся у отправителя, его можно загрузить позже."], "Anhänge empfangen": ["Receive attachments", "Recevoir les pièces jointes", "接收附件", "添付を受け取る", "Получать вложения"], "Alle": ["All", "Toutes", "全部", "すべて", "Все"], "Nur kleine": ["Small only", "Petites seulement", "仅小文件", "小さいものだけ", "Только маленькие"], "Keine": ["None", "Aucune", "不接收", "受け取らない", "Никакие"], "Höchstens pro Austausch": ["Maximum per exchange", "Maximum par échange", "每次交换上限", "1回の交換の上限", "Максимум за обмен"], "Unbegrenzt": ["Unlimited", "Illimité", "不限", "無制限", "Без ограничений"], "Bildqualität beim Posten": ["Image quality when posting", "Qualité des images à la publication", "发布时的图片质量", "投稿時の画質", "Качество изображений при публикации"], "Hoch": ["High", "Haute", "高", "高", "Высокое"], "Mittel": ["Medium", "Moyenne", "中", "中", "Среднее"], "Klein": ["Small", "Petite", "小", "小", "Малое"], "Auf diesem Gerät: {n} Anhänge, {b}. Beim QR-Austausch werden Daten zusätzlich komprimiert.": ["On this device: {n} attachments, {b}. Data is also compressed in QR exchange.", "Sur cet appareil : {n} pièces jointes, {b}. Les données sont aussi compressées lors de l’échange par QR.", "本设备上：{n} 个附件，{b}。二维码交换时数据还会被压缩。", "この端末：添付{n}件、{b}。QR交換ではデータがさらに圧縮されます。", "На этом устройстве: вложений {n}, {b}. При обмене по QR данные дополнительно сжимаются."], "{n} Anhänge ({b}) warten auf dich": ["{n} attachments ({b}) are waiting for you", "{n} pièces jointes ({b}) t’attendent", "{n} 个附件（{b}）等你下载", "添付{n}件（{b}）が待っています", "Ждут вложения: {n} ({b})"], "Beim nächsten Austausch werden sie geladen.": ["They will be loaded at the next exchange.", "Elles seront chargées lors du prochain échange.", "下次交换时会下载。", "次の交換で読み込まれます。", "Они загрузятся при следующем обмене."], "Sie liegen bei anderen Nutzern. Beim nächsten Austausch kannst du sie holen.": ["They are with other users. You can fetch them at the next exchange.", "Elles sont chez d’autres utilisateurs. Tu peux les récupérer lors du prochain échange.", "它们在其他用户那里。下次交换时可以取回。", "他の人のところにあります。次の交換で取りに行けます。", "Они у других пользователей. Ты можешь забрать их при следующем обмене."], "Doch nicht laden": ["Do not load", "Ne pas charger", "不再下载", "読み込まない", "Не загружать"], "Beim nächsten Austausch laden": ["Load at next exchange", "Charger au prochain échange", "下次交换时下载", "次の交換で読み込む", "Загрузить при следующем обмене"], "Liste verwerfen": ["Discard list", "Abandonner la liste", "丢弃列表", "リストを破棄", "Сбросить список"], "Es wartet nichts auf dich.": ["Nothing is waiting for you.", "Rien ne t’attend.", "没有待下载的内容。", "待っているものはありません。", "Ничего не ждёт."], "Anhänge von diesem Gerät entfernen": ["Remove attachments from this device", "Retirer les pièces jointes de cet appareil", "从此设备移除附件", "この端末から添付を削除", "Удалить вложения с этого устройства"], "Beim nächsten Austausch werden die Anhänge geladen.": ["Attachments will be loaded at the next exchange.", "Les pièces jointes seront chargées lors du prochain échange.", "下次交换时将下载附件。", "次の交換で添付を読み込みます。", "Вложения загрузятся при следующем обмене."], "Anhänge entfernt. Du kannst sie später wieder laden.": ["Attachments removed. You can load them again later.", "Pièces jointes retirées. Tu peux les recharger plus tard.", "附件已移除。之后可以重新下载。", "添付を削除しました。後で再び読み込めます。", "Вложения удалены. Позже их можно загрузить снова."], "{n} Anhänge zurückgestellt": ["{n} attachments postponed", "{n} pièces jointes reportées", "{n} 个附件已推迟", "添付{n}件を後回し", "Отложено вложений: {n}"], "Anhang zurückgestellt ({b})": ["Attachment postponed ({b})", "Pièce jointe reportée ({b})", "附件已推迟（{b}）", "添付は後回し（{b}）", "Вложение отложено ({b})"], "Deine Unterhaltungen": ["Your conversations", "Tes conversations", "你的对话", "あなたの会話", "Твои обсуждения"], "Du hast noch keine Unterhaltung gestartet.": ["You have not started a conversation yet.", "Tu n’as pas encore lancé de conversation.", "你还没有发起过对话。", "まだ会話を始めていません。", "Ты ещё не начинал обсуждений."], "Outernet hat keinen Server. Unterhaltungen werden nur aktualisiert, wenn du dich mit anderen austauschst: per QR-Code, WLAN oder Datei.": ["Outernet has no server. Conversations only update when you exchange with others: by QR code, Wi-Fi or file.", "Outernet n’a pas de serveur. Les conversations ne se mettent à jour que lorsque tu échanges avec d’autres : par code QR, Wi-Fi ou fichier.", "Outernet 没有服务器。只有当你与他人交换（二维码、WLAN 或文件）时，对话才会更新。", "Outernetにはサーバーがありません。QRコード、Wi-Fi、ファイルで人と交換したときだけ会話が更新されます。", "У Outernet нет сервера. Обсуждения обновляются, только когда ты обмениваешься с другими: по QR-коду, Wi-Fi или файлом."], "Du siehst den Stand deines letzten Austauschs. Neue Kommentare anderer kommen erst an, wenn du dich wieder mit jemandem austauschst: per QR-Code, WLAN oder Datei.": ["You see the state of your last exchange. Others’ new comments only arrive when you exchange with someone again: by QR code, Wi-Fi or file.", "Tu vois l’état de ton dernier échange. Les nouveaux commentaires des autres n’arrivent que lorsque tu échanges à nouveau : par code QR, Wi-Fi ou fichier.", "你看到的是上次交换时的状态。只有再次与他人交换（二维码、WLAN 或文件）后，才会收到别人的新评论。", "最後の交換時点の内容が見えています。他の人の新しいコメントは、QRコード、Wi-Fi、ファイルで再び交換したときに届きます。", "Ты видишь состояние последнего обмена. Новые комментарии других придут, когда ты снова обменяешься: по QR-коду, Wi-Fi или файлом."], "Er liegt zuerst nur auf deinem Gerät. Andere sehen ihn erst, wenn du den Stand mit ihnen teilst: per QR-Code, WLAN oder Datei.": ["It first lives only on your device. Others only see it when you share your state with them: by QR code, Wi-Fi or file.", "Il reste d’abord sur ton appareil. Les autres ne le voient que lorsque tu partages ton état avec eux : par code QR, Wi-Fi ou fichier.", "它一开始只在你的设备上。只有当你与他们分享（二维码、WLAN 或文件）后，别人才能看到。", "最初はあなたの端末にだけあります。QRコード、Wi-Fi、ファイルで共有すると、他の人にも見えます。", "Сначала он есть только на твоём устройстве. Другие увидят его, когда ты поделишься: по QR-коду, Wi-Fi или файлом."], "Neue Beiträge zu diesem Ort bekommst du nur, wenn du dich mit anderen austauschst, die sie schon haben: per QR-Code, WLAN oder Datei.": ["You only get new posts for this place when you exchange with others who already have them: by QR code, Wi-Fi or file.", "Tu ne reçois de nouveaux messages pour ce lieu que si tu échanges avec d’autres qui les ont déjà : par code QR, Wi-Fi ou fichier.", "只有与已有这些内容的人交换（二维码、WLAN 或文件），你才会收到此地点的新帖子。", "この場所の新しい投稿は、すでに持っている人とQRコード、Wi-Fi、ファイルで交換したときだけ届きます。", "Новые сообщения об этом месте ты получишь, только обменявшись с теми, у кого они уже есть: по QR-коду, Wi-Fi или файлом."], "Nichts. Die besonderen Auszeichnungen schaltest du nach und nach frei, wenn du dich mit anderen austauschst.": ["Nothing. You unlock the special awards bit by bit as you exchange with others.", "Rien. Tu débloques peu à peu les distinctions spéciales en échangeant avec les autres.", "免费。你与他人交换时，特别奖励会逐步解锁。", "無料です。人と交換するうちに、特別な称号が少しずつ解放されます。", "Ничего. Особые награды открываются постепенно, когда ты обмениваешься с другими."], "In jeder Unterhaltung bekommst du einen anderen Tiernamen. Niemand kann sie verbinden. Du brauchst kein Konto.": ["In every conversation you get a different animal name. Nobody can link them. You do not need an account.", "Dans chaque conversation, tu as un autre nom d’animal. Personne ne peut les relier. Tu n’as pas besoin de compte.", "每个对话里你都有不同的动物名，没有人能把它们联系起来。你不需要账号。", "会話ごとに違う動物の名前が付き、誰も結びつけられません。アカウントは不要です。", "В каждом обсуждении у тебя другое имя-животное. Никто не может их связать. Аккаунт не нужен."], "Webseiten": ["Websites", "Sites web", "网页", "ウェブサイト", "Сайты"], "Von Webseiten aus mitreden": ["Join in from websites", "Participer depuis les sites web", "从网页参与讨论", "ウェブサイトから参加する", "Участвовать с сайтов"], "Du bist auf einer Seite und willst darüber sprechen? Mit einem Knopf im Browser öffnest du die passende Unterhaltung. Markierter Text wird zur Textstelle.": ["You are on a page and want to talk about it? One button in your browser opens the matching conversation. Selected text becomes the passage.", "Tu es sur une page et tu veux en parler ? Un bouton dans le navigateur ouvre la conversation correspondante. Le texte sélectionné devient le passage.", "在某个网页上想聊聊？浏览器里的一个按钮就能打开对应的对话。选中的文字会成为讨论的段落。", "ページについて話したいですか？ブラウザのボタンひとつで、対応する会話が開きます。選択した文章は該当箇所になります。", "Ты на странице и хочешь её обсудить? Одна кнопка в браузере откроет подходящее обсуждение. Выделенный текст станет отрывком."], "Lesezeichen": ["Bookmark", "Marque-page", "书签", "ブックマーク", "Закладка"], "Für alle Browse
