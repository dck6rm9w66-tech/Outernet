<h1>Outernet</h1>
<p>Hier steht die Adresse deiner Outernet-App. Wenn du das Plugin aus der App geladen hast, ist sie schon eingetragen.</p>
<input id="u" type="url" placeholder="https://… oder file:///…/app.html">
<button id="b">Speichern</button> <span id="s" role="status"></span>
<p><small>Benutzen: Rechtsklick auf eine Seite, einen Link oder markierten Text, dann „Mit Outernet besprechen“. Oder auf das Outernet-Symbol klicken (Tastenkürzel: Alt+Shift+O).</small></p>
